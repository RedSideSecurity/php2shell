# php2shell: single-worker prefork, no keep-alive (deterministic heap grooming).
# One long-lived PHP worker so heap-grooming state persists across requests.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
